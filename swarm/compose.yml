# Local Docker Swarm cluster: each container runs its own Docker daemon
# (Docker-in-Docker) and plays the role of a machine.
# --privileged is required by DinD but breaks isolation: local use only.
services:
  manager:
    image: docker:dind
    privileged: true
    hostname: manager
    restart: unless-stopped
    tmpfs:
      - /var/run # avoids a stale containerd pid file after a restart
    ports:
      - "80:80" # Traefik, reachable from the host
      - "443:443"
    volumes:
      - /home/manager # anonymous volume: keeps the stack files
    networks:
      cluster:
        # workers store the manager's IP when joining: it must survive restarts
        ipv4_address: 172.28.0.10

  node:
    image: docker:dind
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /var/run
    networks:
      - cluster
    deploy:
      replicas: 3

networks:
  cluster:
    ipam:
      config:
        - subnet: 172.28.0.0/24
