services:
  traefik:
    image: traefik:v3.6
    networks:
      web:
        # lets containers reach Authelia through Traefik with its public name
        aliases:
          - authelia.swarm.localhost
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Swarm API socket
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.watch=true"
      # Don't expose services by default; require explicit labels
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=web"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    configs:
      - source: traefik_tls
        target: /etc/traefik/tls.yml
      - source: swarm_localhost_crt
        target: /certs/swarm.localhost.crt
    secrets:
      - swarm_localhost_key
    deploy:
      mode: replicated
      replicas: 1
      placement:
        # Traefik reads the Swarm API, which is only available on managers
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.swarm.localhost`)"
        - "traefik.http.routers.dashboard.entrypoints=web"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

  whoami:
    image: traefik/whoami
    networks:
      - web
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.swarm.localhost`)"
        - "traefik.http.routers.whoami.entrypoints=web"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"

# Overlay network: connects containers across nodes
networks:
  web:
    external: true

configs:
  traefik_tls:
    file: ./traefik-tls.yml
  swarm_localhost_crt:
    file: ./secrets/swarm.localhost.crt

secrets:
  swarm_localhost_key:
    external: true
