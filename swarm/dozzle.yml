services:
  dozzle:
    image: ghcr.io/amir20/dozzle:latest
    environment:
      DOZZLE_MODE: swarm
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle-data:/data
    secrets:
      - source: dozzle_users
        target: /data/users.yml
    networks:
      - dozzle
      - web
    deploy:
      # one instance per node: each one reads the logs of its own node
      mode: global
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dozzle.rule=Host(`dozzle.swarm.localhost`)"
        - "traefik.http.routers.dozzle.entrypoints=websecure"
        - "traefik.http.routers.dozzle.tls=true"
        - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
        - "traefik.http.services.dozzle.loadbalancer.sticky.cookie=true"

networks:
  dozzle:
    driver: overlay
  web:
    external: true

volumes:
  dozzle-data:

secrets:
  dozzle_users:
    external: true
